[project]
name = "unizo-ctem-mcp"
version = "0.1.0"
description = "MCP server exposing Unizo CTEM platform data to Claude Code"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
unizo-ctem-mcp = "unizo_ctem_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unizo_ctem_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
